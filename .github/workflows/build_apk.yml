name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App base name'
        required: true
        type: string
        default: 'there-are-no-rules'
      version:
        description: 'Build version (e.g. 1.0.0)'
        required: true
        type: string
      create_release:
        description: 'Create a GitHub release?'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          unityVersion: auto
          buildName: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.version }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}
          path: build/Android/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.version }}
          files: build/Android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}